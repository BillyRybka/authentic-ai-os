StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = ProductVoice

# Skip Obsidian frontmatter
BlockIgnores = (?s)^---\n.+?\n---\n

# Skip wikilinks (vault navigation, not prose)
TokenIgnores = \[\[[^\]]+\]\]

# Path exclusions: paths below skip all Vale checks.
# build-plan.md is internal documentation, not user-facing skill content.
# Content/pieces/** is creator-side output (uses CreatorVoice when available, not ProductVoice).
# foundation/** is creator-side output.
# Notes/, raw/, Daily/, Intelligence/, Onboarding/ are scratch/staging.

[build-plan.md]
BasedOnStyles =

[Content/pieces/**]
BasedOnStyles =

[foundation/**]
BasedOnStyles =

[Notes/**]
BasedOnStyles =

[raw/**]
BasedOnStyles =

[Daily/**]
BasedOnStyles =

[Intelligence/**]
BasedOnStyles =

[Onboarding/**]
BasedOnStyles =

# Eval workspaces (deleted but excluded as a defensive default)
[**/*-workspace/**]
BasedOnStyles =
